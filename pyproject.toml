[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsa"
version = "0.1.0"
description = "Hierarchical Sparse Attention: full-lifecycle sparse attention for long-context serving"
requires-python = ">=3.12"
dependencies = ["httpx", "pytest", "pytest-mock"]

[project.scripts]
hsa = "hsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
